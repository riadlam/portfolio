<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>معرض الأعمال</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1419;
        --surface: #1a222c;
        --text: #e8eef4;
        --muted: #9aabbc;
        --accent: #3d8bfd;
        --line: rgba(232, 238, 244, 0.12);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        font-family: Cairo, system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(ellipse 80% 50% at 20% -10%, rgba(61, 139, 253, 0.25), transparent),
          radial-gradient(ellipse 60% 40% at 90% 10%, rgba(90, 160, 120, 0.18), transparent),
          var(--bg);
        padding: 4rem 1.5rem 3rem;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
      }
      .brand {
        font-size: clamp(2rem, 5vw, 2.75rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      .lead {
        color: var(--muted);
        font-size: 1.05rem;
        font-weight: 400;
        line-height: 1.6;
        margin-bottom: 2.5rem;
      }
      ul {
        list-style: none;
        display: grid;
        gap: 0.75rem;
      }
      a {
        display: block;
        padding: 1.15rem 1.25rem;
        text-decoration: none;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        font-weight: 600;
        font-size: 1.1rem;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      a:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="brand">معرض الأعمال</h1>
      <p class="lead">اختر مشروعاً لعرضه.</p>
      <ul>
        <li><a href="/almanara/">المنارة</a></li>
        <li><a href="/lingoleap/">لينجو ليب</a></li>
        <li><a href="/maisonaura/">ميزون أورا</a></li>
        <li><a href="/mizan/">ميزان</a></li>
        <li><a href="/nasma/">نسمة</a></li>
        <li><a href="/techplus/">تك بلس</a></li>
      </ul>
    </div>
  </body>
</html>
